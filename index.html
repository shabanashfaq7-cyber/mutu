<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bunny & Mutu" />
  <meta name="theme-color" content="#140720" />

  <title>Bunny & Mutu — Live</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: radial-gradient(circle at top, #2a0d3d 0%, #100619 65%, #08030d 100%);
      color: #f8fafc;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .serif-title { font-family: 'Playfair Display', serif; }
    .glass {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.13);
    }
    .rose-grad { background: linear-gradient(135deg, #f43f5e 0%, #db2777 50%, #9333ea 100%); }
    .hot-grad { background: linear-gradient(135deg, #991b1b 0%, #e11d48 55%, #7e22ce 100%); }
    .angry-grad { background: linear-gradient(135deg, #450a0a 0%, #991b1b 55%, #7f1d1d 100%); }
    @keyframes pulseBeat {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.18); }
      60% { transform: scale(0.95); }
    }
    .beat { animation: pulseBeat 1.3s infinite ease-in-out; }
    @keyframes floatHeart {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-180px) scale(1.4); opacity: 0; }
    }
    .fly-heart {
      position: fixed;
      pointer-events: none;
      z-index: 99;
      animation: floatHeart 1.6s ease-out forwards;
    }
    @keyframes cardPop {
      0% { transform: scale(0.75) rotate(-2deg); opacity: 0; }
      70% { transform: scale(1.03) rotate(1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .card-pop { animation: cardPop 0.28s ease-out forwards; }
  </style>
</head>
<body class="antialiased">

  <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-5 bg-[#0e0516]">

      <div class="text-center">

        </div>

        <p class="text-xs text-rose-200/70 mt-1">Private Live Space • Shaban & Reshu Only</p>

          <i class="fa-solid fa-face-smile text-lg"></i>
          <span id="faceIdLabel">Unlock with Face ID</span>
        </button>
        <div class="text-center text-[10px] text-slate-400 uppercase tracking-widest my-2.5">— or passcode —</div>
      </div>

        </button>

          <div class="text-2xl">👸🏻</div>
          <div class="text-xs font-extrabold text-white mt-0.5">Mutu</div>
        </button>
      </div>

        </button>

    </div>
  </div>

    function initFaceIdButton() {
      const cred = localStorage.getItem("bm_face_id");
      const owner = localStorage.getItem("bm_face_user");
      if (cred && owner && USERS[owner]) {
        document.getElementById("faceIdBox").classList.remove("hidden");

    initFaceIdButton();

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const key = document.getElementById("userIdInput").value.trim().toLowerCase();
      const pin = document.getElementById("passInput").value.trim();
      const err = document.getElementById("loginErr");
      err.classList.add("hidden");

      if (!USERS[key] || USERS[key].pin !== pin) {
        if (navigator.vibrate) navigator.vibrate([70, 50, 70]);
        err.textContent = "Wrong ID or Passcode!";
        err.classList.remove("hidden");
        return;
      }
      enterApp(key);

    function enterApp(key) {
      const u = USERS[key];
      localStorage.setItem("bm_user_key", key);
      document.getElementById("passInput").value = "";
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      document.getElementById("partnerNameTitle").textContent = u.partnerName;
      document.getElementById("partnerAvatar").textContent = u.partnerIcon;
      if (window.startLiveSync) window.startLiveSync(key);

    function lockApp() {
      document.getElementById("mainApp").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
      initFaceIdButton();

    async function registerFaceID() {
      if (!window.PublicKeyCredential) return alert("Face ID not supported in this browser.");
      const key = localStorage.getItem("bm_user_key") || "bunny";
      try {
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: "Bunny & Mutu Live" },
            user: { id: new TextEncoder().encode(key), name: key, displayName: USERS[key].name },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000
          }
        });
        if (cred) {
          localStorage.setItem("bm_face_id", btoa(String.fromCharCode(...new Uint8Array(cred.rawId))));
          localStorage.setItem("bm_face_user", key);
          toast("Face ID Activated! ✅");
        }
      } catch (e) {
        alert("Face ID setup canceled: " + e.message);
      }
    }

    async function unlockWithFaceID() {
      const cred = localStorage.getItem("bm_face_id");
      const owner = localStorage.getItem("bm_face_user");
      if (!cred || !owner) return;
      try {
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        const rawId = Uint8Array.from(atob(cred), c => c.charCodeAt(0));
        const res = await navigator.credentials.get({
          publicKey: { challenge, allowCredentials: [{ id: rawId, type: "public-key" }], userVerification: "required" }
        });
        if (res) {
          enterApp(owner);
          toast("Unlocked with Face ID ❤️");
        }
      } catch (e) {
        toast("Face ID failed — use passcode");
      }
    }

        switchStickerTab(activeStickerTab);

    function switchStickerTab(tab) {
      activeStickerTab = tab;
      const map = {
        hot: { id: "stTabHot", cls: "px-2 py-1 rounded-lg hot-grad text-white text-[10px] font-extrabold shrink-0" },
        romance: { id: "stTabRomance", cls: "px-2 py-1 rounded-lg rose-grad text-white text-[10px] font-extrabold shrink-0" },

      filterStickers();

    function filterStickers() {
      const q = (document.getElementById("stickerSearchInput").value || "").trim().toLowerCase();
      let pool = [];
      if (q) {
        Object.values(STICKERS_108).forEach(arr => {
          arr.forEach(item => {
            if (item[0].toLowerCase().includes(q) || item[1].toLowerCase().includes(q)) {
              pool.push(item);
            }
          });
        });
      } else {
        pool = STICKERS_108[activeStickerTab] || [];
      }

      document.getElementById("stickerItemsGrid").innerHTML = pool.map(([title, sub, mode]) => {
        const pose = mode === "hot" ? "hot" : mode === "angry" ? "angry" : mode === "sorry" ? "sorry" : "love";
        const bg = mode === "hot"
          ? "bg-rose-950/75 border-rose-500/45 hover:bg-rose-900/80"
          : mode === "angry"
          ? "bg-red-950/75 border-red-500/45 hover:bg-red-900/80"
          : "bg-white/10 border-white/15 hover:bg-white/20";

        return `
          <button type="button" onclick="sendSticker('${pose}', '${title.replace(/'/g, "\\'")}', '${sub.replace(/'/g, "\\'")}', '${mode}')"
            class="p-1.5 rounded-xl ${bg} border text-center flex flex-col items-center justify-center gap-0.5 active:scale-95 transition">
            ${makeCoupleSvg(pose)}
            <span class="text-[10px] font-extrabold text-white line-clamp-1">${title}</span>
          </button>
        `;
      }).join('');
    }

    function flyHearts(mode = "love") {
      const icons = mode === "hot"
        ? ['🔥', '💋', '❤️‍🔥', '😈', '🥵']
        : mode === "angry"
        ? ['😤', '💢', '🔥', '😒']
        : ['❤️', '💖', '💕', '🌹'];
      for (let i = 0; i < 9; i++) {
        const el = document.createElement("span");
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        el.className = "fly-heart text-2xl";
        el.style.left = (15 + Math.random() * 70) + "vw";
        el.style.bottom = "14vh";
        el.style.animationDelay = (i * 0.08) + "s";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1800);
      }
    }

    function toast(msg) {
      const t = document.getElementById("toastBar");
      t.textContent = msg;
      t.classList.remove("hidden");
      setTimeout(() => t.classList.add("hidden"), 2200);
    }

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, doc, setDoc, addDoc, deleteDoc, collection, onSnapshot, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDC2bPdSPl_r3DpbyuV77Xhz8BzS1jpauw",
      authDomain: "bonnington-app.firebaseapp.com",
      projectId: "bonnington-app",
      storageBucket: "bonnington-app.firebasestorage.app",
      messagingSenderId: "164741416650",
      appId: "1:164741416650:web:6f86020cab90e9f0b55633"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const MOODS = ["🥰 In Love", "🔥 Hot Mood", "😤 Gussa Mode", "🥺 Missing You", "💋 Craving Kiss", "🫡 On Duty"];
    let moodIndex = 0;
    let heartbeatTimer = null;

    window.startLiveSync = (userKey) => {
      const me = USERS[userKey].role;
      const partner = USERS[userKey].partnerRole;

      const metaRef = doc(db, "bm_live_v2", "status");
      const msgsCol = collection(db, "bm_live_v2_messages");

      const pingPresence = () => {
        setDoc(metaRef, {
          [me]: { lastSeen: Date.now(), mood: MOODS[moodIndex] }
        }, { merge: true }).catch(err => showSyncError(err));
      };
      pingPresence();
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(pingPresence, 15000);

      onSnapshot(metaRef, (snap) => {
        setSyncConnected();
        if (!snap.exists()) return;
        const data = snap.data();

        if (data.pulseText) {
          document.getElementById("pulseBannerText").textContent = data.pulseText;
        }

        const pInfo = data[partner];
        const dot = document.getElementById("partnerOnlineDot");
        const sub = document.getElementById("partnerPresenceText");

        if (pInfo && pInfo.lastSeen) {
          const isOnline = (Date.now() - pInfo.lastSeen) < 40000;
          dot.className = isOnline
            ? "absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-emerald-400 border-2 border-[#140720] animate-ping"
            : "absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full bg-slate-500 border-2 border-[#140720]";
          const timeStr = new Date(pInfo.lastSeen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          sub.textContent = isOnline
            ? `Online Now • ${pInfo.mood || '🥰 In Love'}`
            : `Last seen ${timeStr} • ${pInfo.mood || ''}`;
        } else {
          sub.textContent = "Waiting for partner to come online...";
        }
      }, (err) => showSyncError(err));

      onSnapshot(query(msgsCol, orderBy("ts", "asc"), limit(100)), (snap) => {
        setSyncConnected();
        const feed = document.getElementById("chatFeed");

        if (snap.empty) {
          feed.innerHTML = `<div class="text-center py-12 text-xs text-slate-400">Live connection ready! Tap 🔥 for 108 couple stickers or send a selfie 📸</div>`;
          return;
        }

        feed.innerHTML = snap.docs.map(d => {
          const m = d.data();
          const mine = m.sender === me;
          const time = m.ts ? new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

          if (m.type === "photo" && m.img) {
            return `
              <div class="flex flex-col ${mine ? 'items-end' : 'items-start'} card-pop">
                <span class="text-[10px] text-slate-400 mb-1 px-1">${m.sender} • ${time}</span>
                <div class="max-w-[75%] p-1.5 rounded-3xl ${mine ? 'rose-grad' : 'bg-white/15'} shadow-lg">
                  <img src="${m.img}" onclick="document.getElementById('zoomImg').src='${m.img}'; document.getElementById('zoomModal').classList.remove('hidden');"
                    class="rounded-2xl max-h-60 object-cover cursor-pointer" />
                </div>
              </div>
            `;
          }

          if (m.type === "sticker") {
            const stickerBg = m.mode === "hot"
              ? "hot-grad border border-rose-300/35 shadow-rose-600/30"
              : m.mode === "angry"
              ? "angry-grad border border-red-400/40 shadow-red-900/40"
              : "rose-grad border border-white/25 shadow-pink-600/25";

            return `
              <div class="flex flex-col ${mine ? 'items-end' : 'items-start'} card-pop">
                <span class="text-[10px] text-slate-400 mb-1 px-1">${m.sender} • ${time}</span>
                <div class="max-w-[82%] px-4 py-3 rounded-3xl ${stickerBg} text-center shadow-xl">
                  ${makeCoupleSvg(m.pose || m.mode || "love")}
                  <div class="serif-title text-sm font-extrabold text-white mt-1">${m.t}</div>
                  <p class="text-[11px] text-white/95 mt-0.5 leading-snug">${m.s}</p>
                </div>
              </div>
            `;
          }

          return `
            <div class="flex flex-col ${mine ? 'items-end' : 'items-start'}">
              <span class="text-[10px] text-slate-400 mb-0.5 px-1">${m.sender} • ${time}</span>
              <div class="max-w-[80%] px-3.5 py-2.5 rounded-2xl text-xs leading-relaxed ${mine ? 'rose-grad text-white rounded-br-sm' : 'bg-white/15 text-white rounded-bl-sm'}">
                ${m.text}
              </div>
            </div>
          `;
        }).join('');

        feed.scrollTop = feed.scrollHeight;
      }, (err) => showSyncError(err));

      document.getElementById("msgForm").onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById("msgInput");
        const val = input.value.trim();
        if (!val) return;
        input.value = "";
        await addDoc(msgsCol, { sender: me, type: "text", text: val, ts: Date.now() });
      };

      window.sendSticker = async (pose, t, s, mode) => {
        if (navigator.vibrate) {
          if (mode === "angry") navigator.vibrate([100, 40, 100]);
          else navigator.vibrate([45, 30, 75]);
        }
        flyHearts(mode);
        document.getElementById("stickerBox").classList.add("hidden");
        await addDoc(msgsCol, { sender: me, type: "sticker", pose, t, s, mode, ts: Date.now() });
      };

      window.uploadPrivatePhoto = (ev) => {
        const file = ev.target.files[0];
        if (!file) return;
        toast("Sending photo...");
        const reader = new FileReader();
        reader.onload = (r) => {
          const img = new Image();
          img.onload = async () => {
            const canvas = document.createElement("canvas");
            const MAX = 680;
            let w = img.width, h = img.height;
            if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
            else if (h > MAX) { w *= MAX / h; h = MAX; }
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.65);
            await addDoc(msgsCol, { sender: me, type: "photo", img: dataUrl, ts: Date.now() });
            flyHearts("love");
            toast("Photo sent! 📸");
            ev.target.value = "";
          };
          img.src = r.target.result;
        };
        reader.readAsDataURL(file);
      };

      window.sendLivePulse = async () => {
        if (navigator.vibrate) navigator.vibrate([60, 40, 100]);
        flyHearts("love");
        const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        await setDoc(metaRef, { pulseText: `💓 ${me} sent a live heartbeat at ${t}` }, { merge: true });
        toast(`Heartbeat sent to ${partner}!`);
      };

      window.cycleMyMood = async () => {
        moodIndex = (moodIndex + 1) % MOODS.length;
        document.getElementById("myMoodPill").textContent = MOODS[moodIndex];
        await setDoc(metaRef, { [me]: { mood: MOODS[moodIndex], lastSeen: Date.now() } }, { merge: true });
      };

      window.clearChatHistory = async () => {
        if (!confirm("Delete all messages & photos for both of you?")) return;
        const snap = await getDocs(msgsCol);
        for (const d of snap.docs) await deleteDoc(doc(db, "bm_live_v2_messages", d.id));
        toast("Chat cleared!");
      };
    };

    function setSyncConnected() {
      const b = document.getElementById("dbSyncBadge");
      b.textContent = "🟢 Live";
      b.className = "text-[9px] px-1.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-bold";
    }

    function showSyncError(err) {
      const b = document.getElementById("dbSyncBadge");
      b.textContent = "🔴 Sync Blocked";
      b.className = "text-[9px] px-1.5 py-0.5 rounded-full bg-red-500/25 text-red-300 font-bold";
      document.getElementById("chatFeed").innerHTML = `
        <div class="p-4 rounded-2xl bg-red-950/70 border border-red-500/40 text-xs text-red-200 space-y-2">
          <div class="font-bold">⚠️ Firebase Sync Error: ${err.code || err.message}</div>
          <p>Firebase Console -> Firestore Database -> Rules mein ja kar <b>allow read, write: if true;</b> publish karein.</p>
        </div>
      `;
    }
  </script>
